{% extends "base.html" %}{% block content %}<section class="panel narrow"><p class="eyebrow">ROOM {{code}}</p><h1>Join location sharing</h1><p>Your location is shared only after you agree and your browser grants GPS permission.</p>
<form id="joinForm"><label>Your display name</label><input id="name" required maxlength="60" placeholder="Your name"><label>Phone number (for identification)</label><input id="phone" required inputmode="numeric" placeholder="10-digit number"><label class="check"><input id="consent" type="checkbox" required> I agree to share my live location with the room owner. I can stop sharing at any time.</label><button class="btn">Agree & continue</button></form><p id="msg" class="error"></p></section>{% endblock %}
{% block scripts %}<script>
document.getElementById('joinForm').onsubmit=async e=>{e.preventDefault();const r=await fetch('/api/join',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({code:'{{code}}',name:document.getElementById('name').value,phone:document.getElementById('phone').value,consent:document.getElementById('consent').checked})});const d=await r.json();if(d.ok)location.href='/share';else document.getElementById('msg').textContent=d.error||'Could not join.'};
</script>{% endblock %}
